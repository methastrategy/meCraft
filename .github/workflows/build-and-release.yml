name: Build & Release meCraft Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/mecraft-launcher/src-tauri
            apps/mepdf/src-tauri
            apps/mephoto/src-tauri

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # 1. Build meCraft Launcher (.exe, .msi, .zip)
      - name: Build meCraft Launcher
        run: |
          cd apps/mecraft-launcher
          npm run desktop:build
          Copy-Item src-tauri/target/release/mecraft-launcher.exe -Destination ../../mecraft-launcher.exe -Force
          Compress-Archive -Path src-tauri/target/release/mecraft-launcher.exe -DestinationPath ../../mecraft-launcher-windows-x64.zip -Force
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *setup.exe -Recurse | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName -Destination ../../mecraft-launcher-setup.exe -Force }
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination ../../mecraft-launcher.msi -Force }
          cd ../..

      # 2. Build mePDF Studio (.exe, .msi, .zip)
      - name: Build mePDF Studio
        run: |
          cd apps/mepdf
          npm run desktop:build
          Copy-Item src-tauri/target/release/mepdf.exe -Destination ../../mepdf.exe -Force
          Compress-Archive -Path src-tauri/target/release/mepdf.exe -DestinationPath ../../mepdf-windows-x64.zip -Force
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *setup.exe -Recurse | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName -Destination ../../mepdf-setup.exe -Force }
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination ../../mepdf.msi -Force }
          cd ../..

      # 3. Build mePhoto Studio (.exe, .msi, .zip)
      - name: Build mePhoto Studio
        run: |
          cd apps/mephoto
          npm run desktop:build
          Copy-Item src-tauri/target/release/mephoto.exe -Destination ../../mephoto.exe -Force
          Compress-Archive -Path src-tauri/target/release/mephoto.exe -DestinationPath ../../mephoto-windows-x64.zip -Force
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *setup.exe -Recurse | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName -Destination ../../mephoto-setup.exe -Force }
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination ../../mephoto.msi -Force }
          cd ../..

      # 4. Upload Assets to GitHub Release
      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.exe
            *.msi
            *.zip
          draft: false
          prerelease: false
          generate_release_notes: true
