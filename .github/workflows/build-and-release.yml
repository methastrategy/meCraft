name: Build & Release meCraft Suite

on:
  push:
    tags:
      - 'v*'
      - 'mepdf-v*'
      - 'mephoto-v*'
      - 'launcher-v*'
      - 'meide-v*'
      - 'medocs-v*'
      - 'medoc-v*'
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Target Application to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mecraft-launcher
          - meide
          - medocs
          - mepdf
          - mephoto

permissions:
  contents: write

jobs:
  # ============================================================
  # Stage 1: Fast Quality Gate (Unit Tests & Typecheck)
  # ============================================================
  verify:
    name: Verify Tests & Types
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite (372+ tests)
        run: npm test

      - name: Run Typecheck Across Workspaces
        run: npm run typecheck

  # ============================================================
  # Stage 2: Parallel Matrix Build (3x Speedup)
  # ============================================================
  build-app:
    name: Build ${{ matrix.display_name }}
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_id: mecraft-launcher
            display_name: 'meCraft Launcher'
            dir: apps/mecraft-launcher
            exe_name: mecraft-launcher
          - app_id: meide
            display_name: 'meIDE Studio'
            dir: apps/meide
            exe_name: meide
          - app_id: medocs
            display_name: 'meDocs Studio'
            dir: apps/medocs
            exe_name: medocs
          - app_id: mepdf
            display_name: 'mePDF Studio'
            dir: apps/mepdf
            exe_name: mepdf
          - app_id: mephoto
            display_name: 'mePhoto Studio'
            dir: apps/mephoto
            exe_name: mephoto
    steps:
      - name: Evaluate Build Target Trigger
        id: filter
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          INPUT="${{ inputs.target_app }}"
          APP="${{ matrix.app_id }}"

          if [ -n "$INPUT" ]; then
            if [ "$INPUT" = "all" ] || [ "$INPUT" = "$APP" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          if [[ "$TAG" == v* ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == mepdf-v* ]] && [ "$APP" = "mepdf" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == mephoto-v* ]] && [ "$APP" = "mephoto" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == launcher-v* ]] && [ "$APP" = "mecraft-launcher" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == meide-v* ]] && [ "$APP" = "meide" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == medocs-v* || "$TAG" == medoc-v* ]] && [ "$APP" = "medocs" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.filter.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.filter.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        if: steps.filter.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        if: steps.filter.outputs.should_build == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ matrix.dir }}/src-tauri

      - name: Install Dependencies
        if: steps.filter.outputs.should_build == 'true'
        run: npm ci || npm install

      - name: Import Launcher signing certificate
        if: steps.filter.outputs.should_build == 'true' && matrix.app_id == 'mecraft-launcher' && github.ref_type == 'tag'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MECRAFT_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MECRAFT_WINDOWS_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.MECRAFT_SIGNING_THUMBPRINT }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:CERTIFICATE_PASSWORD -or $env:EXPECTED_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Configure the Windows publisher certificate before releasing meCraft.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mecraft-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:/CurrentUser/My' -Password $password
            if ($certificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT -or -not $certificate.HasPrivateKey) {
              throw 'Imported publisher certificate does not match the configured thumbprint.'
            }
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Tauri v2 Windows binaries
        if: steps.filter.outputs.should_build == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MECRAFT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MECRAFT_UPDATER_PRIVATE_KEY_PASSWORD }}
          MECRAFT_SIGNING_THUMBPRINT: ${{ vars.MECRAFT_SIGNING_THUMBPRINT }}
          MECRAFT_SIGNING_TIMESTAMP_URL: ${{ vars.MECRAFT_SIGNING_TIMESTAMP_URL }}
        run: |
          if ("${{ matrix.app_id }}" -eq 'mecraft-launcher' -and '${{ github.ref_type }}' -eq 'tag') {
            $version = (Get-Content 'apps/mecraft-launcher/package.json' -Raw | ConvertFrom-Json).version
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/mecraft.exe"
            & ./scripts/build-signed-launcher.ps1 -InstallerUrl $url -ManifestOutput (Join-Path $env:RUNNER_TEMP 'stable.json') -Channel stable
            if ($LASTEXITCODE -ne 0) { throw 'Signed Launcher build failed.' }
          } else {
            Push-Location '${{ matrix.dir }}'
            try {
              npm run desktop:build
              if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
            } finally {
              Pop-Location
            }
          }

          $outDir = "dist-artifacts/${{ matrix.app_id }}"
          New-Item -ItemType Directory -Force -Path $outDir

          if ("${{ matrix.app_id }}" -eq "mecraft-launcher") {
            # Public meCraft download has one stable EXE asset name.
            $version = (Get-Content 'apps/mecraft-launcher/package.json' -Raw | ConvertFrom-Json).version
            $builtExe = "apps/mecraft-launcher/src-tauri/target/release/mecraft-launcher.exe"
            $nsisExe = "apps/mecraft-launcher/src-tauri/target/release/bundle/nsis/meCraft_$($version)_x64-setup.exe"
            if (Test-Path -LiteralPath $nsisExe) {
              Copy-Item -LiteralPath $nsisExe -Destination "$outDir/mecraft.exe" -Force
            } elseif (Test-Path -LiteralPath $builtExe) {
              Copy-Item -LiteralPath $builtExe -Destination "$outDir/mecraft.exe" -Force
            } else {
              throw 'Launcher EXE artifact is missing.'
            }
          } else {
            # Ecosystem Sub-Apps (mePDF, mePhoto) - Distributed for in-app 1-click install via meCraft Hub
            $exe = "${{ matrix.dir }}/src-tauri/target/release/${{ matrix.exe_name }}.exe"
            if (Test-Path $exe) {
              Copy-Item $exe -Destination "$outDir/${{ matrix.exe_name }}.exe" -Force
              Compress-Archive -Path $exe -DestinationPath "$outDir/${{ matrix.exe_name }}-windows-x64.zip" -Force
            }
          }

      - name: Verify Launcher publisher before tagged release
        if: steps.filter.outputs.should_build == 'true' && matrix.app_id == 'mecraft-launcher' && github.ref_type == 'tag'
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ vars.MECRAFT_SIGNING_THUMBPRINT }}
        run: |
          if ($env:EXPECTED_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Configure the expected Windows publisher before releasing Launcher.'
          }
          $installer = 'dist-artifacts/mecraft-launcher/mecraft.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            throw 'Launcher installer must be signed by the configured publisher.'
          }

      - name: Stash Binaries for Release
        if: steps.filter.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.app_id }}
          path: dist-artifacts/${{ matrix.app_id }}/*
          if-no-files-found: ignore

      - name: Stash Stable update feed for website deployment
        if: steps.filter.outputs.should_build == 'true' && matrix.app_id == 'mecraft-launcher' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mecraft-stable-update-feed
          path: |
            ${{ runner.temp }}/stable.json
            ${{ runner.temp }}/stable.json.sig
          if-no-files-found: error

  # ============================================================
  # Stage 3: Atomic Release Publisher
  # ============================================================
  publish-release:
    name: Publish Official Release
    needs: build-app
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download All Application Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: ls -la release-assets/

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Generate published meDocs catalog
        if: github.repository == 'methastrategy/meCraft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq 'add' | node scripts/generate-package-catalog.js > v1.json

      - name: Upload website catalog
        if: github.repository == 'methastrategy/meCraft'
        uses: actions/upload-artifact@v4
        with:
          name: mecraft-package-catalog
          path: v1.json
