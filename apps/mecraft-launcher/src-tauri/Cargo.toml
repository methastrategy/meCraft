[package]
name = "mecraft-launcher"
version = "1.0.0"
description = "meCraft Central Creative Hub & Dynamic Downloader Launcher"
authors = ["Metha Triparpanchit"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mecraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.6" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
