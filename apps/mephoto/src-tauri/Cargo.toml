[package]
name = "mephoto"
version = "1.0.0"
description = "mePhoto Studio - CamScanner Pro Desktop Application"
authors = ["Metha Triparpanchit"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mephoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
