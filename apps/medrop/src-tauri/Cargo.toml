[package]
name = "medrop"
version = "1.0.0"
description = "meDrop Zero-Window Radial File Converter & Studio Gateway"
authors = ["Metha Triparpanchit"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "medrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
